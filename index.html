<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red Shoes: instant travel agendas from your profile</title>
<meta name="description" content="Set your travel profile once. Get an instant day-by-day agenda and map for any destination. Free, no chatbot.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css?v=20">
</head>
<body>
<header class="top">
  <a class="brand" href="#plan" data-nav="plan"><img class="logo" src="img/shoes.png?v=1" alt="" width="58" height="46"><span class="name"><b>Red</b> Shoes</span></a>
  <nav class="tabs" id="tabs">
    <button data-nav="plan" class="on" data-t="nav_plan">Plan</button>
    <button data-nav="profile" data-t="nav_profile">My profile</button>
    <button data-nav="about" data-t="nav_about">About</button>
  </nav>
  <select id="langSel" aria-label="Language"><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option></select>
</header>

<main>
  <section id="view-plan" class="view on">
    <div class="planwrap">
      <aside class="side" id="side">
        <div id="profileCard" class="pcard" hidden></div>
        <form id="tripForm" class="trip" autocomplete="off">
          <label class="lbl" for="where" data-t="where">Where?</label>
          <input id="where" type="text" required data-tp="where_ph" placeholder="Toronto, Montréal, Vancouver...">
          <div class="chips" id="quick"><button type="button" data-city="Toronto">Toronto</button><button type="button" data-city="Montréal">Montréal</button><button type="button" data-city="Vancouver">Vancouver</button></div>
          <div class="lbl" data-t="when">When?</div>
          <div class="dates">
            <label><span data-t="from">From</span><input id="from" type="date" required></label>
            <label><span data-t="to">To</span><input id="to" type="date" required></label>
          </div>
          <div class="btnrow">
            <button class="btn pri" type="submit" id="goBtn" data-t="go">Show me</button>
            <button class="btn" type="button" id="nearBtn" data-t="near">Near me now</button>
          </div>
        </form>
        <div id="status" class="status" aria-live="polite" hidden></div>
        <div id="alts" class="alts" hidden></div>
        <div id="out"></div>
      </aside>
      <div class="mapcol">
        <div id="map"></div>
        <div class="mobtoggle"><button id="mtList" class="on" data-t="list">Agenda</button><button id="mtMap" data-t="map">Map</button></div>
      </div>
    </div>
  </section>

  <section id="view-profile" class="view">
    <div class="page" id="wizard"></div>
  </section>

  <section id="view-about" class="view">
    <div class="page prose" id="about"></div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>
<script src="vendor/leaflet.js"></script>
<script src="config.js"></script>
<script src="i18n.js?v=9"></script>
<script src="icons.js?v=1"></script>
<script src="app.js?v=35"></script>
</body>
</html>
